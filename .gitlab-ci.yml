# Пайплайн: unit-тесты → интеграционные тесты (Testcontainers в docker:dind)
#           → сборка и пуш образов в GitLab Container Registry → деплой на сервер (вручную).
#
# Переменные CI/CD (Settings → CI/CD → Variables), нужны только для deploy:
#   SSH_PRIVATE_KEY  — приватный ключ для доступа к серверу (type: Variable, masked)
#   DEPLOY_HOST      — адрес сервера
#   DEPLOY_USER      — пользователь на сервере (в группе docker)
#   JWT_KEY, POSTGRES_PASSWORD, RABBITMQ_PASSWORD, ADMIN_PASSWORD — секреты продового окружения (опционально, лучше в ~/quorum/.env на сервере)

stages: [ test, integration, build, deploy ]

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"

.dotnet:
  image: mcr.microsoft.com/dotnet/sdk:10.0
  cache:
    key:
      files: [ Directory.Packages.props ]
    paths: [ .nuget/packages ]

unit-tests:
  extends: .dotnet
  stage: test
  script:
    - dotnet test Quorum.slnx -c Release --filter "Category!=Integration" --logger "trx;LogFileName=unit.trx"
  artifacts:
    when: always
    paths: [ "tests/**/TestResults/*.trx" ]
    expire_in: 1 week

worker-check:
  stage: test
  image: python:3.12-slim
  script:
    - pip install --no-cache-dir -r src/Worker/requirements.txt
    - cd src/Worker
    - python -m grpc_tools.protoc -I ../Shared/Quorum.Application/Protos --python_out=quorum_worker --grpc_python_out=quorum_worker worker.proto
    - sed -i 's/^import worker_pb2/from . import worker_pb2/' quorum_worker/worker_pb2_grpc.py
    - python -c "import quorum_worker.server"

integration-tests:
  extends: .dotnet
  stage: integration
  services:
    - name: docker:27-dind
      alias: docker
      command: [ "--tls=false" ]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker   # контейнеры доступны по имени сервиса dind
  script:
    - dotnet test Quorum.slnx -c Release --filter "Category=Integration" --logger "trx;LogFileName=integration.trx"
  artifacts:
    when: always
    paths: [ "tests/**/TestResults/*.trx" ]
    expire_in: 1 week

build-images:
  stage: build
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    REGISTRY: $CI_REGISTRY_IMAGE
    TAG: $CI_COMMIT_SHORT_SHA
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker compose build
    - docker compose push
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  image: alpine:3.20
  environment:
    name: production
    url: http://$DEPLOY_HOST:8000
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/quorum"
    - scp docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:~/quorum/docker-compose.yml"
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" "
        cd ~/quorum &&
        echo '$CI_REGISTRY_PASSWORD' | docker login -u '$CI_REGISTRY_USER' --password-stdin '$CI_REGISTRY' &&
        export REGISTRY='$CI_REGISTRY_IMAGE' TAG='$CI_COMMIT_SHORT_SHA' &&
        docker compose pull &&
        docker compose up -d --no-build --remove-orphans &&
        docker image prune -f
      "
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
