# Модели-учителя для распознавания текста (сервис llm в docker-compose.gpu.yml).
#
# Имя модели здесь = имя учителя в Labeling и в experiments (--teachers): воркер передаёт его в поле
# "model", llama-swap выгружает текущую модель и поднимает нужную. Суффикс «-1234» в имени учителя
# воркер отбрасывает.
#
# Скачивать руками ничего не нужно: llama-server -hf <репозиторий>:<квантизация> сам берёт модель
# и её mmproj (визуальный энкодер) с HuggingFace при первом запуске и кладёт в том llm_cache.
# Скачать и проверить все модели заранее: ./scripts/warmup_vlm.sh
#
# Квантизация Q4_K_M — каждая модель влезает в 16 ГБ вместе с контекстом.
# Свой файл вместо -hf: -m /models/<файл>.gguf --mmproj /models/<mmproj>.gguf (папка ./models-gguf).

# Первый запуск модели — это скачивание 3–6 ГБ; по умолчанию llama-swap ждёт 2 минуты и сдаётся.
healthCheckTimeout: 1800

# Простаивающая модель выгружается через 2 минуты: иначе держит видеопамять, пока воркер обучает студента.
globalTTL: 120

macros:
  server: /app/llama-server --port ${PORT} --n-gpu-layers 99 --ctx-size 4096 --parallel 2 --temp 0

models:
  # Qwen — официальный GGUF от авторов модели.
  qwen3-vl-8b:
    cmd: ${server} -hf Qwen/Qwen3-VL-8B-Instruct-GGUF:Q4_K_M

  # Gemma — сборки от разработчиков llama.cpp (ggml-org), рекомендованы в их документации.
  gemma-3-4b:
    cmd: ${server} -hf ggml-org/gemma-3-4b-it-GGUF:Q4_K_M

  gemma-4-e4b:
    cmd: ${server} -hf ggml-org/gemma-4-E4B-it-GGUF:Q4_0 --reasoning-budget 0

  # Лучшая модель курсовой. Сборка unsloth; если warmup_vlm.sh скажет, что она не видит картинки
  # (в репозитории нет mmproj), закомментируй эту запись и не включай её в --teachers.
  qwen3.5-9b:
    cmd: ${server} -hf unsloth/Qwen3.5-9B-GGUF:Q4_K_M --reasoning-budget 0

  gemma-4-12b:
    cmd: ${server} -hf ggml-org/gemma-4-12b-it-GGUF:Q4_0 --reasoning-budget 0

  qwen3.5-9b-q8:
    cmd: ${server} -hf unsloth/Qwen3.5-9B-GGUF:Q8_0 --reasoning-budget 0

  qwen3-vl-8b-q8:
    cmd: ${server} -hf Qwen/Qwen3-VL-8B-Instruct-GGUF:Q8_0